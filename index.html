<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アファメーション疲れタイプ診断</title>
  <meta name="description" content="あなたはどのアファメーション疲れタイプかを診断します。">
  <style>
    :root{color-scheme:dark;--bg:#070912;--panel:rgba(13,18,34,.88);--panel2:rgba(20,28,50,.76);--line:rgba(151,176,220,.24);--text:#f6f8fc;--muted:#aeb8ca;--blue:#8fc5ff;--mint:#67e5c3;--yellow:#ffd75a;--red:#ff6275;--shadow:0 28px 90px rgba(0,0,0,.38)}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Yu Gothic","Meiryo",sans-serif;background:radial-gradient(circle at 18% 14%,rgba(143,197,255,.18),transparent 28rem),radial-gradient(circle at 88% 34%,rgba(103,229,195,.12),transparent 26rem),linear-gradient(180deg,#080b16,#050710);color:var(--text);letter-spacing:0} body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(143,197,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(143,197,255,.04) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,#000,transparent)}
    .app{width:min(1040px,calc(100% - 32px));margin:0 auto;padding:28px 0 48px;position:relative}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,rgba(143,197,255,.28),rgba(103,229,195,.22));border:1px solid var(--line);position:relative;box-shadow:0 0 36px rgba(103,229,195,.16);flex:0 0 auto}.mark:before,.mark:after{content:"";position:absolute;border-radius:999px;background:var(--mint)}.mark:before{width:20px;height:4px;left:11px;top:19px}.mark:after{width:4px;height:20px;left:19px;top:11px;opacity:.55}h1{margin:0;font-size:clamp(22px,4.8vw,38px);line-height:1.15;font-weight:950}.badge{border:1px solid rgba(255,215,90,.36);color:#ffe7a0;background:rgba(255,215,90,.08);border-radius:999px;padding:8px 14px;font-weight:850;font-size:13px;white-space:nowrap}
    .layout{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}.panel,.side{border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);backdrop-filter:blur(10px);border-radius:8px}.panel{overflow:hidden}.progress{padding:20px 24px 0}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;font-weight:850;margin-bottom:10px}.track{height:9px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}.fill{width:0;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--mint),var(--yellow));transition:width .42s cubic-bezier(.2,.8,.2,1)}
    .question{min-height:570px;padding:38px 42px 34px;display:flex;flex-direction:column;justify-content:space-between;gap:28px}.enter{animation:in .36s cubic-bezier(.2,.8,.2,1)}@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}.kicker{color:var(--mint);font-size:15px;font-weight:950;margin-bottom:12px}.question h2{margin:0;font-size:clamp(28px,5.2vw,48px);line-height:1.25;font-weight:950}.question p{color:var(--muted);font-size:17px;line-height:1.8;margin:16px 0 0;max-width:760px}.answers{display:grid;gap:12px}.answer{width:100%;appearance:none;border:1px solid rgba(151,176,220,.24);background:var(--panel2);color:var(--text);border-radius:8px;min-height:72px;padding:16px 18px;display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:center;text-align:left;cursor:pointer;transition:transform .18s,border-color .18s,background .18s;font:inherit}.answer:hover,.answer:focus-visible{transform:translateY(-2px);border-color:rgba(103,229,195,.56);background:rgba(25,36,62,.9);outline:0}.letter{width:40px;height:40px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-weight:950;background:rgba(255,255,255,.08);color:var(--blue);border:1px solid rgba(143,197,255,.28)}.answer strong{display:block;font-size:18px;line-height:1.45}.nav{display:flex;justify-content:space-between;gap:12px;padding-top:8px}button.secondary,button.primary,a.primary{min-height:48px;border-radius:8px;border:1px solid var(--line);padding:0 18px;font:inherit;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}button.secondary{background:rgba(255,255,255,.06);color:var(--muted)}button.secondary:disabled{opacity:.35;cursor:default}button.primary,a.primary{background:linear-gradient(135deg,var(--mint),var(--blue));color:#06101a;border:0;box-shadow:0 14px 44px rgba(103,229,195,.18)}
    .side{padding:22px;position:sticky;top:20px}.side-title{font-size:15px;color:var(--muted);font-weight:950;margin-bottom:18px}.mini{display:grid;gap:12px}.mini-row{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center}.icon{height:48px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:950}.mini-row:nth-child(1) .icon{color:var(--blue);background:rgba(143,197,255,.1)}.mini-row:nth-child(2) .icon{color:var(--yellow);background:rgba(255,215,90,.1)}.mini-row:nth-child(3) .icon{color:var(--red);background:rgba(255,98,117,.1)}.mini-row:nth-child(4) .icon{color:var(--mint);background:rgba(103,229,195,.1)}.mini-row b{display:block;font-size:14px}.mini-row span{display:block;color:var(--muted);font-size:12px;line-height:1.5;margin-top:2px}
    .result{display:none;padding:34px}.result.show{display:block;animation:in .42s cubic-bezier(.2,.8,.2,1)}.result-grid{display:grid;grid-template-columns:1fr 290px;gap:22px;align-items:stretch}.result-card{border:1px solid rgba(103,229,195,.28);border-radius:8px;background:rgba(8,14,28,.8);padding:30px;position:relative;overflow:hidden}.result-card:after{content:"";position:absolute;right:-110px;top:-120px;width:300px;height:300px;border-radius:999px;border:2px solid rgba(103,229,195,.15)}.type{color:var(--yellow);font-weight:950;font-size:18px;margin-bottom:10px}.result h2{margin:0;font-size:clamp(30px,5vw,52px);line-height:1.18;font-weight:950}.copy{color:var(--muted);font-size:17px;line-height:1.9;margin:22px 0 0}.stop{margin:24px 0 0;padding:0;list-style:none;display:grid;gap:10px}.stop li{border-left:4px solid var(--mint);background:rgba(255,255,255,.055);border-radius:6px;padding:12px 14px;font-weight:850;line-height:1.6}.cta{border:1px solid rgba(255,215,90,.3);border-radius:8px;background:rgba(255,215,90,.08);padding:24px;display:flex;flex-direction:column;justify-content:space-between;gap:18px}.friend-title{font-size:22px;font-weight:950;line-height:1.45;color:#fff4c5}.friend-note{margin:0;color:#ffe9a8;line-height:1.75;font-weight:850}.friend-button{min-height:58px;border-radius:8px;background:#06c755;color:white;text-decoration:none;font-weight:950;display:flex;align-items:center;justify-content:center;box-shadow:0 16px 42px rgba(6,199,85,.24)}.qr-note{font-size:12px;color:rgba(255,255,255,.58);font-weight:800;text-align:center}.qr{width:140px;aspect-ratio:1;margin:0 auto;border-radius:8px;background:#fff;padding:10px;display:flex;align-items:center;justify-content:center;border:6px solid #fff}.qr img{width:100%;height:100%;object-fit:contain;display:block;image-rendering:auto}.reset{margin-top:18px;width:100%}
    @media(max-width:860px){.layout,.result-grid{grid-template-columns:1fr}.side{position:static}.top{align-items:flex-start;flex-direction:column}.question{padding:28px 20px 24px;min-height:620px}.progress{padding:18px 20px 0}.answer{grid-template-columns:36px 1fr;padding:14px}.letter{width:36px;height:36px}.result{padding:20px}.result-card,.cta{padding:20px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><div class="brand"><div class="mark" aria-hidden="true"></div><h1>アファメーション疲れタイプ診断</h1></div><div class="badge">全5問・約40秒</div></header>
    <section class="layout" id="quiz-layout">
      <div class="panel">
        <div class="progress"><div class="meta"><span id="progress-label">Question 1 / 8</span><span id="progress-percent">0%</span></div><div class="track"><div class="fill" id="progress-fill"></div></div></div>
        <div class="question" id="question-card"><div><div class="kicker">今の感覚に近いものを選んでください</div><h2 id="question-title"></h2><p id="question-note"></p></div><div><div class="answers" id="answers"></div><div class="nav"><button class="secondary" id="back" type="button">戻る</button><button class="secondary" id="restart" type="button">最初から</button></div></div></div>
        <div class="result" id="result"></div>
      </div>
      <aside class="side" aria-label="診断タイプ一覧"><div class="side-title">診断される4タイプ</div><div class="mini"><div class="mini-row"><div class="icon">A</div><div><b>虚しさタイプ</b><span>やるたびに心が遠くなる</span></div></div><div class="mini-row"><div class="icon">B</div><div><b>自責タイプ</b><span>続かない自分を責める</span></div></div><div class="mini-row"><div class="icon">C</div><div><b>不信タイプ</b><span>信じきれない自分が嫌になる</span></div></div><div class="mini-row"><div class="icon">D</div><div><b>停滞タイプ</b><span>何年やっても現実が変わらない</span></div></div></div></aside>
    </section>
  </main>
  <script>
    const LINE_URL="https://line.me/R/ti/p/%40936izaiz";
    const QR_IMAGE_URL="https://qr-official.line.me/gs/M_936izaiz_GW.png?oat_content=qr";
    const questions=[
      {title:"アファメーションを唱えたあと、いちばん近い感覚は？",note:"正しい答えはありません。最近の自分に近いものを選んでください。",answers:[["A","前向きな言葉なのに、どこか虚しくなる"],["B","続けられない自分がダメに感じる"],["C","言葉を信じきれない自分が嫌になる"],["D","結局、現実は変わっていないと思う"]]},
      {title:"一番しんどかった瞬間はどれですか？",note:"違和感の出方にはタイプがあります。直感で選んでください。",answers:[["A","唱えている途中で、心が空っぽになる瞬間"],["B","今日もできなかった、と責め始める瞬間"],["C","それ本当？と内側から声が出る瞬間"],["D","何ヶ月も続けたのに変化がないと気づく瞬間"]]},
      {title:"続かなかったとき、最初に出やすい考えは？",note:"ここは結果タイプに強く関係します。",answers:[["A","そもそも何のためにやっているんだろう"],["B","また私は続けられなかった"],["C","信じられない私はおかしいのかもしれない"],["D","これだけやっても何も変わらない"]]},
      {title:"本当は、何をやめたいですか？",note:"結果画面で「やめていいこと」を出すための質問です。",answers:[["A","心が反応していない言葉を唱えること"],["B","続けられなかった自分を責めること"],["C","信じ込もうと無理をすること"],["D","現実を見ないふりして努力を重ねること"]]},
      {title:"最後に、今のあなたに一番必要な言葉は？",note:"この答えで最終結果を微調整します。",answers:[["A","虚しくなるなら、もう唱えなくていい"],["B","続かなかったことを責めなくていい"],["C","信じられない反応は、正直さかもしれない"],["D","変わらなかった現実を、ちゃんと見ていい"]]}
    ];    const results={A:{label:"Aタイプ",title:"やるたびに虚しくなるタイプ",copy:"あなたは、言葉と本音の距離にかなり敏感な人です。前向きな言葉を唱えても、心が置いていかれる感覚が出やすいかもしれません。無理に明るい言葉を足すより、まずは空っぽになる言葉を減らすことが大切です。",stops:["心が反応していない言葉を毎日唱えること","前向きになれない自分を直そうとすること","虚しさを無視して続けること"]},B:{label:"Bタイプ",title:"続けられない自分を責めるタイプ",copy:"あなたは、努力しようとする力がある分、続かなかったときに自分を責めやすいタイプです。でも、続かなかったことは意志の弱さではなく、内側が無理を知らせていたサインかもしれません。",stops:["できなかった日を失敗扱いすること","毎日完璧に続けようとすること","自分を責めて行動力を出そうとすること"]},C:{label:"Cタイプ",title:"信じきれない自分が嫌になるタイプ",copy:"あなたは、本音とのズレを見逃せない正直なタイプです。『それ本当？』という声が出るのは、疑い深いからではなく、今の自分に合わない言葉を見分けている反応かもしれません。",stops:["信じ込めない自分を否定すること","違和感を押し込めて言葉を繰り返すこと","本音より命令を優先すること"]},D:{label:"Dタイプ",title:"何年やっても現実が変わらないタイプ",copy:"あなたは、言葉だけで現実を変えようとして疲れてきたタイプです。もう一度アファメーションを増やすより、現実を責めずに見て、変えられる小さな行動へ戻すことが助けになります。",stops:["現実を見ないふりして言葉だけを重ねること","変わらない焦りを前向きな言葉で隠すこと","小さな行動より大きな言葉を優先すること"]}};
    let index=0;const scores={A:0,B:0,C:0,D:0};const history=[];const card=document.getElementById("question-card"),title=document.getElementById("question-title"),note=document.getElementById("question-note"),answers=document.getElementById("answers"),back=document.getElementById("back"),restart=document.getElementById("restart"),progressLabel=document.getElementById("progress-label"),progressPercent=document.getElementById("progress-percent"),progressFill=document.getElementById("progress-fill"),result=document.getElementById("result");
    function renderQuestion(){const q=questions[index],progress=Math.round(index/questions.length*100);progressLabel.textContent=`Question ${index+1} / ${questions.length}`;progressPercent.textContent=`${progress}%`;progressFill.style.width=`${progress}%`;title.textContent=q.title;note.textContent=q.note;answers.innerHTML="";q.answers.forEach(([type,text])=>{const b=document.createElement("button");b.className="answer";b.type="button";b.innerHTML=`<span class="letter">${type}</span><strong>${text}</strong>`;b.addEventListener("click",()=>choose(type));answers.appendChild(b)});back.disabled=index===0;card.classList.remove("enter");void card.offsetWidth;card.classList.add("enter")}
    function choose(type){scores[type]++;history.push(type);index++;index>=questions.length?showResult():renderQuestion()}
    function topType(){return Object.entries(scores).sort((a,b)=>b[1]-a[1]||["A","B","C","D"].indexOf(a[0])-["A","B","C","D"].indexOf(b[0]))[0][0]}
    function showResult(){const type=topType(),data=results[type];progressFill.style.width="100%";progressPercent.textContent="100%";progressLabel.textContent="Result";card.style.display="none";result.classList.add("show");result.innerHTML=`<div class="result-grid"><div class="result-card"><div class="type">${data.label}</div><h2>${data.title}</h2><p class="copy">${data.copy}</p><ul class="stop">${data.stops.map(i=>`<li>${i}</li>`).join("")}</ul></div><div class="cta"><div><div class="friend-title">タイプ別の<br>「やめていいこと」を受け取る</div><p class="friend-note">スマホの方は下のボタンからLINEに進めます。</p></div><a class="friend-button" href="${LINE_URL}">LINEで友だち登録する</a><div><div class="qr-note">PCで見ている方はこちら</div><div class="qr" aria-label="LINE公式QRコード"><img src="${QR_IMAGE_URL}" alt="LINE公式アカウントQRコード"></div></div></div></div><button class="secondary reset" type="button" onclick="resetQuiz()">もう一度診断する</button>`}
    function resetQuiz(){index=0;history.length=0;Object.keys(scores).forEach(k=>scores[k]=0);result.classList.remove("show");result.innerHTML="";card.style.display="flex";renderQuestion()}
    back.addEventListener("click",()=>{if(index===0)return;const prev=history.pop();scores[prev]--;index--;renderQuestion()});restart.addEventListener("click",resetQuiz);renderQuestion();
  </script>
</body>
</html>
